# Nginx configuration for the website
# Copy to /etc/nginx/sites-available/website and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name localhost;  # Change to your domain

    # Root directory for static files
    root /root/Website;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting zones (define in http block of nginx.conf if needed)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~* (\.env|\.git|node_modules|package-lock\.json|package\.json|server\.js)$ {
        deny all;
    }

    # API: File upload - proxy to Node.js
    location = /upload {
        # limit_req zone=upload burst=5 nodelay;
        
        client_max_body_size 10M;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout for uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API: Password verification - proxy to Node.js
    location = /verify-password {
        # limit_req zone=api burst=5 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files - images (cache for 1 year)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static files - CSS/JS (cache for 1 week)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML files and pages
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Uploads directory - serve files but no directory listing
    location /uploads/ {
        autoindex off;
        try_files $uri =404;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
