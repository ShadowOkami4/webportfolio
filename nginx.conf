# Rendered by setup-nginx.sh. Do not replace __DOMAIN__ manually.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/webportfolio;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    root /var/www/webportfolio;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PortfolioSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://ko-fi.com; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /LunaEcho { try_files /pages/lunaecho.html =404; }
    location = /LunaEcho/ { return 308 /LunaEcho; }
    location = /LunaEcho/Privacy { try_files /pages/lunaecho-privacy.html =404; }
    location = /LunaEcho/Privacy/ { return 308 /LunaEcho/Privacy; }
    location = /LunaEcho/Terms { try_files /pages/lunaecho-terms.html =404; }
    location = /LunaEcho/Terms/ { return 308 /LunaEcho/Terms; }
    location = /MirrorGate { try_files /pages/mirrorgate.html =404; }
    location = /MirrorGate/ { return 308 /MirrorGate; }
    location = /MirrorGate/Logo { try_files /pages/mirrorgate-logo-code.html =404; }
    location = /MirrorGate/Logo/ { return 308 /MirrorGate/Logo; }
    location = /Voidline { try_files /pages/voidline.html =404; }
    location = /Voidline/ { return 308 /Voidline; }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(?:gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
