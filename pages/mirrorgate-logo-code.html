<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirrorGate CSS Logo</title>
    <link rel="canonical" href="https://shadowokami.com/MirrorGate/Logo">
    <link rel="stylesheet" href="../assets/css/language.css?v=4">
    <script src="../assets/js/head.js?v=2"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: #070a0e;
        }

        .mirrorgate-logo {
            isolation: isolate;
            position: relative;
            width: min(1100px, 100%);
            overflow: hidden;
            aspect-ratio: 16 / 10;
            border: 1px solid rgba(157, 225, 216, .18);
            border-radius: 38px;
            background:
                radial-gradient(circle at 68% 48%, rgba(116, 210, 199, .2), transparent 16rem),
                radial-gradient(circle at 18% 82%, rgba(202, 177, 119, .14), transparent 20rem),
                linear-gradient(135deg, #0c151b, #11101a 62%, #080c11);
        }

        .mirrorgate-logo::before {
            position: absolute;
            inset: 0;
            z-index: -1;
            content: "";
            opacity: .34;
            background-image:
                linear-gradient(rgba(157, 225, 216, .06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(157, 225, 216, .06) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(circle at 66% 48%, #000, transparent 62%);
        }

        .mirror-orbit {
            position: absolute;
            top: 50%;
            left: 63%;
            width: min(55%, 650px);
            aspect-ratio: 1;
            border: 1px solid rgba(157, 225, 216, .18);
            border-radius: 50%;
            box-shadow: 0 0 70px rgba(116, 210, 199, .08);
            transform: translate(-50%, -50%) rotate(-16deg) scaleY(.38);
        }

        .mirror-door {
            position: absolute;
            top: 50%;
            left: 63%;
            width: clamp(150px, 23%, 290px);
            aspect-ratio: .7;
            border: 2px solid rgba(202, 177, 119, .62);
            border-radius: 50% 50% 30% 30% / 32% 32% 12% 12%;
            background:
                linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .13) 49%, transparent 56%),
                radial-gradient(ellipse at 48% 45%, rgba(121, 218, 206, .32), rgba(9, 20, 25, .94) 62%);
            box-shadow:
                0 0 0 13px rgba(202, 177, 119, .05),
                0 0 0 28px rgba(116, 210, 199, .035),
                0 30px 80px rgba(0, 0, 0, .48),
                inset 0 0 70px rgba(116, 210, 199, .16);
            transform: translate(-50%, -50%);
            transition: border-color .7s ease, box-shadow .7s ease, transform .7s ease;
        }

        .mirrorgate-logo:hover .mirror-door {
            border-color: rgba(216, 244, 239, .82);
            box-shadow:
                0 0 0 13px rgba(202, 177, 119, .06),
                0 0 0 28px rgba(116, 210, 199, .05),
                0 35px 90px rgba(0, 0, 0, .55),
                inset 0 0 85px rgba(116, 210, 199, .23);
            transform: translate(-50%, -50%) scale(1.025);
        }

        .mirror-door::before,
        .mirror-door::after {
            position: absolute;
            content: "";
        }

        .mirror-door::before {
            inset: 8%;
            border: 1px solid rgba(157, 225, 216, .24);
            border-radius: inherit;
        }

        .mirror-door::after {
            top: 15%;
            right: 18%;
            width: 18%;
            height: 64%;
            border-radius: 50%;
            background: rgba(225, 248, 244, .1);
            filter: blur(7px);
            transform: rotate(-12deg);
        }

        .mirror-handle {
            position: absolute;
            top: 48%;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d6bd83;
            box-shadow: 0 0 18px rgba(214, 189, 131, .78);
        }

        .mirror-wordmark {
            position: absolute;
            bottom: 10%;
            left: 6%;
            z-index: 2;
        }

        .mirror-wordmark small,
        .mirror-wordmark strong {
            display: block;
        }

        .mirror-wordmark small {
            margin-bottom: 8px;
            color: #91cfc6;
            font: 700 clamp(8px, .8vw, 11px) Consolas, monospace;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .mirror-wordmark strong {
            color: #f4f1e8;
            font: 700 clamp(3rem, 8vw, 8rem) "Bahnschrift", sans-serif;
            letter-spacing: -.075em;
            line-height: .8;
            text-shadow: 0 18px 50px rgba(0, 0, 0, .45);
            text-transform: uppercase;
        }

        @media (max-width: 560px) {
            .mirrorgate-logo {
                aspect-ratio: 4 / 5;
                border-radius: 28px;
            }

            .mirror-door,
            .mirror-orbit {
                left: 70%;
            }

            .mirror-wordmark {
                top: 14%;
                bottom: auto;
            }
        }
    </style>
</head>
<body>
    <div class="mirrorgate-logo" role="img" aria-label="MirrorGate logo: a luminous mirrored doorway">
        <span class="mirror-orbit" aria-hidden="true"></span>
        <span class="mirror-door" aria-hidden="true"><i class="mirror-handle"></i></span>
        <span class="mirror-wordmark">
            <small>The Mirrored Realms</small>
            <strong>MirrorGate</strong>
        </span>
    </div>
    <script src="../assets/js/translations.js?v=4"></script>
</body>
</html>
